<g class="note-item" data-note-index="3"><text class="accidental" x="134" y="149">&#9837;</text><text class="note" x="144" y="157" text-anchor="middle">7</text><circle class="dot" cx="144" cy="162" r="2"/><line class="dash" x1="158" y1="148" x2="174" y2="148"/></g>
