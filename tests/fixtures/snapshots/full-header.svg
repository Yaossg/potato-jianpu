<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="152" viewBox="0 0 500 152" style="color: #111827">
<defs>
<style>
.title { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 700; }
.subtitle { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 400; }
.metadata { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 400; }
.key-signature .note { font-size: 20px; font-weight: 700; }
.key-signature .metadata { font-size: 20px; font-weight: 400; }
.time-signature { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; }
.time-signature line { stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.line-label { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; }
.lyric-line { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 400; }
.lyric-syllable { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 400; }
.voice-bracket { stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: butt; stroke-linejoin: miter; }
.note { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
.accidental { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
.dot { fill: currentColor; }
.bar-thin { stroke: currentColor; stroke-width: 2.5; stroke-linecap: butt; }
.bar-final { stroke: currentColor; stroke-width: 5; stroke-linecap: butt; }
.repeat-dot { fill: currentColor; }
.ending-line { stroke: currentColor; stroke-width: 2; fill: none; }
.ending-label { fill: currentColor; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; }
.tempo-mark { fill: currentColor; font-family: "Segoe UI Symbol", "Noto Music", "Noto Sans Symbols 2", Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 400; }
.underline { stroke: currentColor; stroke-width: 2.5; }
.dash { stroke: currentColor; stroke-width: 3; }
.tie { fill: currentColor; stroke: currentColor; stroke-width: 1; }
.velocity { fill: currentColor; font-family: 'Georgia Pro', Georgia, 'DejaVu Serif', Times, 'Times New Roman', FreeSerif, 'DejaVu Math TeX', serif; font-size: 14px; font-style: italic; font-weight: bold; }
.note-item { cursor: pointer; }
.note-item.active .note, .note-item.active .accidental, .note-item.active .dot, .note-item.active .velocity { fill: #dc2626; }
.note-item.active .underline, .note-item.active .dash { stroke: #dc2626; }
</style>
</defs>
<rect class="page-background" x="0" y="0" width="500" height="152" fill="#ffffff"/>
<text class="title" x="250" y="40" text-anchor="middle">Full Header</text>
<text class="subtitle" x="250" y="72" text-anchor="middle">Snapshot Case</text>
<g class="key-signature">
<text class="note" x="10" y="112" text-anchor="start" dominant-baseline="central">1</text>
<text class="metadata" x="28" y="112" dominant-baseline="central"> = B&#9837;</text>
</g>
<g class="time-signature">
<text x="104" y="104" text-anchor="middle" dominant-baseline="central">6</text>
<line x1="96" y1="112" x2="112" y2="112"/>
<text x="104" y="120" text-anchor="middle" dominant-baseline="central">8</text>
</g>
<text class="tempo-mark" x="138" y="112" dominant-baseline="central">♪ = 96</text>
<text class="metadata" x="450" y="112" text-anchor="end">Composer Name</text>

</svg>
